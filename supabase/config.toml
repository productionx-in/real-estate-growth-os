# Supabase Local Development Configuration
# Production X - Disposable CI & Local Validation Environment
project_id = "real-estate-growth-os"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = false
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Branded auth emails, generated from lib/email/layout.ts by scripts/build-auth-email-templates.mjs.
[auth.email.template.confirmation]
subject = "Confirm your email for REGrow"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your REGrow password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your REGrow sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for REGrow"
content_path = "./supabase/templates/email_change.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

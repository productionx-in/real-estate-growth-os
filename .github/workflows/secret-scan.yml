name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: No credentials in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan the working tree
        run: node scripts/security/scan-secrets.mjs
      - name: Scan the commits in this pull request
        if: github.event_name == 'pull_request'
        run: |
          git diff -U0 --no-color "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          node scripts/security/scan-secrets.mjs --diff-file /tmp/pr.diff

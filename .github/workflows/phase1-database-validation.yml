name: Phase 1 Database Validation & Multi-Connection Concurrency

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Enforce zero remote access: only runner permissions
permissions:
  contents: read

jobs:
  validate-database:
    name: Clean DB Migrations, Integration & Concurrency Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Every `run` step uses bash with errexit, nounset and pipefail. Without pipefail,
    # `node test.mjs | tee log` returns tee's exit status (0) and a failing test is reported
    # as a passing step. GitHub's default for steps without `shell:` is `bash -e {0}`, which
    # does not set pipefail.
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}

    steps:
      # 1. Checkout Repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Setup Node.js Environment
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install Project Dependencies
      - name: Install project dependencies
        id: install
        run: npm ci

      # 4. Install Pinned Supabase CLI (exact 2.122.1 avoids legacy Issue #4746 parser bug)
      - name: Setup Pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      # 5. Start Disposable Local Supabase Stack (Docker-backed)
      - name: Start Disposable Local Supabase Stack
        id: stack
        run: |
          echo "Starting disposable local Supabase environment on runner..."
          # The database container sometimes fails to bind its port on a fresh runner ("address already in use")
          # before any test runs. Clean up and try again (up to 3 attempts) instead of failing the whole run.
          for attempt in 1 2 3; do
            if supabase start --debug; then break; fi
            if [ "$attempt" = 3 ]; then echo "Supabase did not start after 3 attempts."; exit 1; fi
            echo "supabase start failed (attempt $attempt); cleaning up and retrying in 15 s..."
            supabase stop --no-backup || true
            docker ps -aq --filter "name=supabase_" | xargs -r docker rm -f || true
            docker network ls -q --filter "name=supabase_network" | xargs -r docker network rm || true
            sleep 15
          done
          echo "Disposable Supabase services started successfully."
          supabase status

          # Create diagnostics directory early
          mkdir -p diagnostics

          # Export local credentials using 127.0.0.1 (IPv4 avoids Linux localhost ::1 ECONNREFUSED)
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> $GITHUB_ENV
          echo "SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> $GITHUB_ENV

          # grep -m1 instead of `grep | head -n1`: under pipefail, head closing the pipe early can fail grep with SIGPIPE.
          ANON_KEY=$(supabase status -o env | grep -m1 '^ANON_KEY=' | cut -d '=' -f2 | tr -d '"')
          SERVICE_KEY=$(supabase status -o env | grep -m1 '^SERVICE_ROLE_KEY=' | cut -d '=' -f2 | tr -d '"')
          if [ -z "$ANON_KEY" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Could not read local Supabase API keys from 'supabase status -o env'"
            exit 1
          fi

          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_KEY" >> $GITHUB_ENV

      # 6. Apply Full Migration History from a Clean Database (0001 through 20260032)
      - name: Apply Complete Migration History (Clean DB Reset)
        id: migrate
        run: |
          echo "Executing clean database reset to apply all 32 migrations in exact sequence..."
          supabase db reset --debug
          echo "All migrations applied successfully from clean state."

      # 7. Install Postgres Driver for Test Execution
      - name: Install pg driver on runner
        id: pgdriver
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: npm install --no-save pg

      # 8. Execute Real Database Integration Tests (Phase 4)
      - name: Execute Real Database Integration Tests (Phase 4)
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Running real database integration tests against disposable PostgreSQL instance..."
          node tests/db-integration/phase1-real-db.test.mjs 2>&1 | tee diagnostics/phase1-real-db.log

      # 9. Execute Real Multi-Connection Concurrency Tests (Phase 5)
      - name: Execute Multi-Connection Concurrency Tests (Phase 5)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for concurrency isolation..."
          supabase db reset --debug
          echo "Running multi-connection concurrency tests against disposable PostgreSQL instance..."
          node tests/db-integration/phase1-concurrency.test.mjs 2>&1 | tee diagnostics/phase1-concurrency.log

      # 10. Execute Real Supabase Auth Live AAL2 & Bootstrap CLI Tests
      - name: Execute Live Supabase Auth AAL2 & Bootstrap CLI Tests
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for live bootstrap isolation..."
          supabase db reset --debug
          echo "Running live Supabase Auth AAL2 and Bootstrap CLI test suite..."
          node tests/db-integration/phase1-bootstrap-cli.test.mjs 2>&1 | tee diagnostics/phase1-bootstrap-cli.log

      # 10b. Subscription catalog & seat purchase RLS regression (migration 20260035)
      # Runs under the job default shell (bash -euo pipefail), so a failing test cannot be masked by `tee`.
      - name: Execute Subscription Catalog RLS Regression Tests (Migration 20260035)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for subscription catalog RLS isolation..."
          supabase db reset --debug
          node tests/db-integration/subscription-catalog-rls.test.mjs 2>&1 | tee diagnostics/subscription-catalog-rls.log

      # 10c. M0 sales tenant-integrity triggers (migration 20260036)
      - name: Execute M0 Sales Tenant Integrity Tests (Migration 20260036)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for M0 tenant-integrity isolation..."
          supabase db reset --debug
          node tests/db-integration/m0-sales-tenant-integrity.test.mjs 2>&1 | tee diagnostics/m0-sales-tenant-integrity.log

      # 10d. M1 teams & lead routing (migrations 20260037, 20260038): routing engine + DAL
      - name: Execute M1 Lead Routing Tests (Migrations 20260037-20260038)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for M1 routing isolation..."
          supabase db reset --debug
          node tests/db-integration/m1-lead-routing.test.mjs 2>&1 | tee diagnostics/m1-lead-routing.log
          node tests/db-integration/m1-routing-dal.test.mjs 2>&1 | tee diagnostics/m1-routing-dal.log

      # 10e. M1 notifications outbox, inbox, job queue and scheduler (migration 20260039)
      - name: Execute M1 Notifications, Job Queue & Web Push Tests (Migrations 20260039-20260040)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for M1 notifications isolation..."
          supabase db reset --debug
          node tests/db-integration/m1-notifications.test.mjs 2>&1 | tee diagnostics/m1-notifications.log
          node tests/db-integration/m1-push.test.mjs 2>&1 | tee diagnostics/m1-push.log

      # 10f. M2 response clock, outcomes & follow-ups (migration 20260041)
      - name: Execute M2 Follow-up, M3 Reporting & RLS Closure Tests (Migrations 20260041-20260043)
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && steps.pgdriver.outcome == 'success' }}
        run: |
          echo "Executing clean database reset for M2 isolation..."
          supabase db reset --debug
          node tests/db-integration/m2-follow-ups.test.mjs 2>&1 | tee diagnostics/m2-follow-ups.log
          node tests/db-integration/m3-reporting.test.mjs 2>&1 | tee diagnostics/m3-reporting.log
          node tests/db-integration/m1-dead-rls.test.mjs 2>&1 | tee diagnostics/m1-dead-rls.log
          node tests/db-integration/p0-invitation-email.test.mjs 2>&1 | tee diagnostics/p0-invitation-email.log
          node tests/db-integration/p1-org-lifecycle.test.mjs 2>&1 | tee diagnostics/p1-org-lifecycle.log
          node tests/db-integration/p3-support-access.test.mjs 2>&1 | tee diagnostics/p3-support-access.log
          node tests/db-integration/p3b-entitlements.test.mjs 2>&1 | tee diagnostics/p3b-entitlements.log
          node tests/db-integration/p7-function-grants.test.mjs 2>&1 | tee diagnostics/p7-function-grants.log
          node tests/db-integration/p8-action-board.test.mjs 2>&1 | tee diagnostics/p8-action-board.log
          node tests/db-integration/p9-site-visits.test.mjs 2>&1 | tee diagnostics/p9-site-visits.log
          node tests/db-integration/p10-saved-views.test.mjs 2>&1 | tee diagnostics/p10-saved-views.log
          node tests/db-integration/p11-website-capture.test.mjs 2>&1 | tee diagnostics/p11-website-capture.log
          node tests/db-integration/p12-whatsapp-inbox.test.mjs 2>&1 | tee diagnostics/p12-whatsapp-inbox.log
          node tests/db-integration/p13-documents.test.mjs 2>&1 | tee diagnostics/p13-documents.log
          node tests/db-integration/p14-property-matching.test.mjs 2>&1 | tee diagnostics/p14-property-matching.log
          node tests/db-integration/p15-workspace-search.test.mjs 2>&1 | tee diagnostics/p15-workspace-search.log
          node tests/db-integration/p16-roles.test.mjs 2>&1 | tee diagnostics/p16-roles.log
          node tests/db-integration/p17-billing.test.mjs 2>&1 | tee diagnostics/p17-billing.log
          node tests/db-integration/p18-lead-foundation.test.mjs 2>&1 | tee diagnostics/p18-lead-foundation.log
          node tests/db-integration/p19-partner-network.test.mjs 2>&1 | tee diagnostics/p19-partner-network.log
          node tests/db-integration/p20-billing-enforcement.test.mjs 2>&1 | tee diagnostics/p20-billing-enforcement.log
          node tests/db-integration/p21-showroom-enquiry.test.mjs 2>&1 | tee diagnostics/p21-showroom-enquiry.log
          node tests/db-integration/p22-payments.test.mjs 2>&1 | tee diagnostics/p22-payments.log
          node tests/db-integration/p23-internal-portal.test.mjs 2>&1 | tee diagnostics/p23-internal-portal.log
          node tests/db-integration/p24-payments-operations.test.mjs 2>&1 | tee diagnostics/p24-payments-operations.log
          node tests/db-integration/p25-demo-environment.test.mjs 2>&1 | tee diagnostics/p25-demo-environment.log
          node tests/db-integration/p26-assistant-memory.test.mjs 2>&1 | tee diagnostics/p26-assistant-memory.log
          node tests/db-integration/p27-organisation-delete.test.mjs 2>&1 | tee diagnostics/p27-organisation-delete.log
          node tests/db-integration/p28-customer-emails.test.mjs 2>&1 | tee diagnostics/p28-customer-emails.log
          node tests/db-integration/p29-daily-and-activation-emails.test.mjs 2>&1 | tee diagnostics/p29-daily-and-activation-emails.log
          node tests/db-integration/p30-email-outbox.test.mjs 2>&1 | tee diagnostics/p30-email-outbox.log
          node tests/db-integration/p31-plot-maps.test.mjs 2>&1 | tee diagnostics/p31-plot-maps.log
          node tests/db-integration/p40-plot-map-documents.test.mjs 2>&1 | tee diagnostics/p40-plot-map-documents.log
          node tests/db-integration/p41-plot-map-shapes.test.mjs 2>&1 | tee diagnostics/p41-plot-map-shapes.log
          node tests/db-integration/p42-plot-map-publishing.test.mjs 2>&1 | tee diagnostics/p42-plot-map-publishing.log
          node tests/db-integration/p43-plot-map-setup.test.mjs 2>&1 | tee diagnostics/p43-plot-map-setup.log
          node tests/db-integration/p44-plot-map-staff-drawing.test.mjs 2>&1 | tee diagnostics/p44-plot-map-staff-drawing.log
          node tests/db-integration/p45-partner-unit-requests.test.mjs 2>&1 | tee diagnostics/p45-partner-unit-requests.log
          node tests/db-integration/p46-lead-segments.test.mjs 2>&1 | tee diagnostics/p46-lead-segments.log
          node tests/db-integration/p47-campaigns.test.mjs 2>&1 | tee diagnostics/p47-campaigns.log
          node tests/db-integration/p48-whatsapp-auto-reply.test.mjs 2>&1 | tee diagnostics/p48-whatsapp-auto-reply.log
          node tests/db-integration/p49-sign-in-activity.test.mjs 2>&1 | tee diagnostics/p49-sign-in-activity.log
          node tests/db-integration/p50-inventory-category.test.mjs 2>&1 | tee diagnostics/p50-inventory-category.log
          node tests/db-integration/p51-whatsapp-numbers.test.mjs 2>&1 | tee diagnostics/p51-whatsapp-numbers.log
          node tests/db-integration/p52-lead-alerts.test.mjs 2>&1 | tee diagnostics/p52-lead-alerts.log
          node tests/db-integration/p53-performance-engine.test.mjs 2>&1 | tee diagnostics/p53-performance-engine.log
          node tests/db-integration/p32-lead-archive.test.mjs 2>&1 | tee diagnostics/p32-lead-archive.log
          node tests/db-integration/p33-workspace-settings.test.mjs 2>&1 | tee diagnostics/p33-workspace-settings.log
          node tests/db-integration/p34-lead-fields.test.mjs 2>&1 | tee diagnostics/p34-lead-fields.log
          node tests/db-integration/p35-notification-rules.test.mjs 2>&1 | tee diagnostics/p35-notification-rules.log
          node tests/db-integration/p36-visit-matching-settings.test.mjs 2>&1 | tee diagnostics/p36-visit-matching-settings.log
          node tests/db-integration/p37-project-unit-delete.test.mjs 2>&1 | tee diagnostics/p37-project-unit-delete.log
          node tests/db-integration/p38-team-targets.test.mjs 2>&1 | tee diagnostics/p38-team-targets.log
          node tests/db-integration/p39-listings.test.mjs 2>&1 | tee diagnostics/p39-listings.log

      # 11. Execute Application Regression Test Suite (Phase 6)
      - name: Execute Application Regression Test Suite (All 27 Tests)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p diagnostics
          echo "Running existing project test suite..."
          npm test 2>&1 | tee diagnostics/npm-test.log

      # 12. Execute TypeScript Compiler Check
      - name: Execute TypeScript Compiler Check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p diagnostics
          echo "Validating TypeScript types..."
          npx tsc --noEmit 2>&1 | tee diagnostics/tsc-check.log

      # 13. Capture Diagnostic State & Catalog Information
      - name: Capture Database Catalog Diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          echo "Dumping routine definitions and security types..."
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "
            SELECT routine_name, routine_type, security_type, specific_schema 
            FROM information_schema.routines 
            WHERE specific_schema = 'public' 
            ORDER BY routine_name;
          " > diagnostics/catalog_routines.txt 2>&1 || true

          echo "Dumping table RLS states..."
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "
            SELECT tablename, rowsecurity 
            FROM pg_tables 
            WHERE schemaname = 'public' 
            ORDER BY tablename;
          " > diagnostics/catalog_tables.txt 2>&1 || true

          echo "Dumping platform bootstrap state..."
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -c "
            SELECT * FROM public.platform_bootstrap_state;
          " > diagnostics/bootstrap_state.txt 2>&1 || true

          echo "=== Test Log Summaries ==="
          for f in diagnostics/*.log; do
            if [ -f "$f" ]; then
              echo "--- $f (last 50 lines) ---"
              tail -n 50 "$f"
            fi
          done

      # 14. Publish Diagnostic Artifacts
      - name: Publish Test Artifacts & Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-validation-diagnostics
          path: diagnostics/
          retention-days: 7

      # 15. Clean Up Disposable Environment
      - name: Clean Up Disposable Supabase Stack
        if: always()
        run: |
          echo "Stopping and tearing down disposable local Supabase containers..."
          supabase stop || true
